[workspace]
resolver = "2"
members = [
    "crates/hermes-core",
    "crates/hermes-gateway",
    "crates/hermes-gpui",
    "crates/hermes-chat",
    "crates/hermes-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["QuantVL"]
repository = "https://github.com/QuantVL/hermes-agent-in-rust"
description = "Hermes Agent rewritten in Rust"

[workspace.dependencies]
# Core — pinned to versions verified to exist on crates.io (2026-11)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
thiserror = "1.0.69"
anyhow = "1.0.100"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
dirs = "5.0.1"
tracing = "0.1.41"
# Task 1 spike — pinned GUI/network stack (crates.io only, no git deps).
gpui = "=0.2.2"
tokio = { version = "1", features = ["rt-multi-thread","net","macros","time","sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json","rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Transitive compatibility pins (crates.io only):
# gpui 0.2.2 -> gpui_http_client -> zed-async-tar 0.5.0-zed -> xattr 0.2.3,
# and xattr 0.2.3 uses `libc::ENOATTR`, which libc removed in 0.2.190.
# mio 1.2.1+ requires libc >= 0.2.190, so mio must be pinned alongside libc.
libc = "=0.2.189"
mio = "=1.2.0"

[workspace.metadata.cargo-dist]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
installers = ["tarball"]
ci = "github"
publish = "github-releases"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"