name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # GPUI 0.2.2's default features (x11 + wayland + font-kit) and its
      # `test-support` feature pull in xkbcommon/wayland/fontconfig bindings.
      # These need the corresponding dev headers at compile time on ubuntu.
      - name: Install GPUI Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libfontconfig1-dev

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build check
        run: cargo check --workspace --all-targets

      - name: Tests
        run: cargo test --workspace
